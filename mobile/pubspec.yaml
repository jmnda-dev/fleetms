name: fleetms_mobile
description: "FleetMS mobile app — offline-first fleet management, a client of the FleetMS JSON:API."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (manual providers — no codegen; see AGENTS.md).
  flutter_riverpod: ^2.5.1

  # Navigation.
  go_router: ^14.2.0

  # HTTP + auth/tenant interceptors (used only via core/api_client.dart).
  dio: ^5.5.0

  # Secure persistence for the auth token + selected organization.
  flutter_secure_storage: ^9.2.2

  # Offline cache + outbox (chosen; wired in a later step — see AGENTS.md "Offline").
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  connectivity_plus: ^6.0.3
  image_picker: ^1.2.3
  signature: ^6.4.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # For drift codegen once offline is wired.
  build_runner: ^2.4.11
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
