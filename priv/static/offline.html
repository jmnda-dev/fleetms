<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · FleetMS</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --border: #e2e8f0;
        --heading: #0f172a;
        --body: #475569;
        --brand: #001a72;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --card: #1e293b;
          --border: #334155;
          --heading: #ffffff;
          --body: #94a3b8;
          --brand: #87cce8;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--body);
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card {
        width: 100%;
        max-width: 400px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 32px 24px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
      }
      img { width: 72px; height: 72px; margin-bottom: 16px; }
      h1 { margin: 0 0 8px; font-size: 20px; color: var(--heading); }
      p { margin: 0 0 20px; font-size: 14px; line-height: 1.5; }
      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        background: var(--brand);
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        padding: 12px 20px;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        button { color: #04103b; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/images/icon-192.png" alt="FleetMS" />
      <h1>You're offline</h1>
      <p>
        FleetMS needs a connection to load your fleet. Check your network and try
        again — your data is safe on the server.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
